[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "records-atlas"
version = "0.1.0"
description = "配套《Python语言从入门到精通》的可运行验证工程"
authors = [{name = "iaoexl"}]
# 包元数据只描述代码部分；README.md 与 docs/ 另行采用 CC BY 4.0，完整边界见 LICENSE。
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["records"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
